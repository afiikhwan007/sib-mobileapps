<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: presenter stage — phone-sized app frame beside a function checklist; full-screen app on phones. Single light look by choice (branded app UI). */
:root{
  --navy:#34327F; --navy-2:#24225E; --navy-ink:#1B1A45; --orange:#F37021; --orange-soft:#FDEBDF;
  --bg:#F3F3F9; --card:#FFFFFF; --line:#E1E1EE; --ink:#1B1A33; --muted:#66667E; --soft:#EEEEF7;
  --good:#1E8E5A; --good-soft:#E3F4EB; --warn:#B7791F; --warn-soft:#FBF0D9; --bad:#C2392F; --bad-soft:#FBE5E3;
  --ev:#1E7FD8; --phev:#7A4BD1; --hyb:#1E8E5A; --wa:#25D366;
  --stage:#E9E9F3; --stage-ink:#2A2850;
  --f-display:"Saira","Arial Narrow",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.stage{min-height:100%;display:flex;gap:32px;justify-content:center;align-items:flex-start;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{position:relative;width:392px;height:820px;max-height:calc(100vh - 56px);min-height:640px;background:var(--bg);border-radius:44px;border:10px solid #15142E;box-shadow:0 30px 60px -20px rgba(27,26,69,.45);overflow:hidden;flex:none;display:flex;flex-direction:column}
.panel{width:400px;max-width:100%;min-width:0;color:var(--stage-ink)}
@media (max-width:860px){
  .stage{padding:0;gap:0;display:block;height:100%}
  .phone{width:100%;height:100%;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
  .panel{display:none}
  .panel.open{display:block;position:fixed;inset:0;z-index:60;width:auto;background:var(--stage);overflow:auto;padding:16px}
  .demo-chip{display:flex!important}
}
/* status bar */
.sbar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--sbar,var(--card));color:var(--sbar-ink,var(--ink))}
@media (max-width:860px){.sbar{display:none}}
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);min-height:56px}
.top .logo{height:26px;width:auto}
.top h1{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.ibtn{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--navy)}
.ibtn:hover{background:var(--soft)}
.badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 96px;-webkit-overflow-scrolling:touch}
.scroll.nopad{padding:0 0 96px}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--navy)}
.nav button.on svg{color:var(--orange)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
svg.i.xs{width:15px;height:15px}
/* type */
.h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0 0 4px;text-wrap:balance;letter-spacing:-.005em}
.h3{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0;letter-spacing:.005em}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.sec:first-child{margin-top:0}
.link{color:var(--navy);font-weight:700;font-size:13px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
button.li:hover{background:#FAFAFD}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--navy);flex:none}
.ico.or{background:var(--orange-soft);color:var(--orange)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--navy);color:#fff;width:100%}
.btn:hover{background:var(--navy-2)}
.btn.or{background:var(--orange)}
.btn.or:hover{background:#DD5F12}
.btn.ghost{background:var(--card);color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.sm{height:36px;font-size:13px;border-radius:11px;width:auto;padding:0 14px}
.btn.danger{background:var(--card);color:var(--bad);border:1.5px solid var(--bad-soft)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.btns>*{flex:1}
.footer{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;background:linear-gradient(to top,var(--bg) 70%,rgba(243,243,249,0));z-index:5}
/* chips & pills */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pt-EV{background:#E2EFFB;color:var(--ev)}.pt-PHEV{background:#EEE7FA;color:var(--phev)}.pt-HYBRID{background:var(--good-soft);color:var(--hyb)}
.st-good{background:var(--good-soft);color:var(--good)}.st-warn{background:var(--warn-soft);color:var(--warn)}.st-bad{background:var(--bad-soft);color:var(--bad)}.st-info{background:#E2EFFB;color:var(--ev)}.st-mute{background:var(--soft);color:var(--muted)}.st-or{background:var(--orange-soft);color:#C4550F}
/* hero */
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(243,112,33,.22)}
.hero .k{font-size:12px;opacity:.75;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hero .car{font-family:var(--f-display);font-size:22px;font-weight:700;margin:4px 0 2px}
.plate{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:12px;background:#fff;color:var(--navy-ink);border-radius:6px;padding:2px 7px;letter-spacing:.06em}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.qa .ico{width:52px;height:52px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.banner{border-radius:18px;padding:16px;color:#fff;background:linear-gradient(120deg,var(--orange),#E2531A);min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.banner b{font-family:var(--f-display);font-size:19px;line-height:1.15;display:block;max-width:230px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;width:250px}
/* service card */
.svc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.svc .ph{width:64px;height:64px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.strike{text-decoration:line-through;color:var(--muted);font-weight:500;font-size:12px;margin-left:4px}
.stars{display:inline-flex;gap:1px;color:#F2A31B}
.stars svg{width:14px;height:14px;fill:currentColor;stroke:none}
/* grid of brands */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.brand{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:12.5px;text-align:center}
.mono-logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--navy);background:var(--soft);letter-spacing:.02em}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink)}
.inp{height:48px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;width:100%}
.inp:focus{outline:none;border-color:var(--navy)}
.inp.err{border-color:var(--bad)}
textarea.inp{height:auto;padding:12px 14px;min-height:88px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.errt{font-size:12px;color:var(--bad);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--navy);flex:none}
/* calendar/time */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .dw{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day .dn{font-family:var(--f-display);font-size:20px;font-weight:700}
.day .dm{font-size:10.5px;color:var(--muted)}
.day.on{background:var(--navy);border-color:var(--navy);color:#fff}
.day.on .dw,.day.on .dm{color:rgba(255,255,255,.75)}
.day.off{opacity:.38;pointer-events:none;background:repeating-linear-gradient(135deg,var(--card) 0 6px,var(--soft) 6px 12px)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border-radius:13px;border:1.5px solid var(--line);background:var(--card);padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot b{font-family:var(--f-mono);font-size:14px}
.slot span{font-size:10.5px;color:var(--good);font-weight:700}
.slot.low span{color:var(--warn)}
.slot.full{background:var(--soft);pointer-events:none}
.slot.full b{color:var(--muted);text-decoration:line-through}
.slot.full span{color:var(--muted)}
.slot.on{border-color:var(--orange);background:var(--orange-soft)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--orange)}
.timer{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:#7A4E0E;border-radius:14px;padding:11px 14px;font-weight:600;font-size:13px}
.timer b{font-family:var(--f-mono);font-size:16px;margin-left:auto}
/* summary rows */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kv.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-size:16px}
.kv.total span{color:var(--ink);font-weight:800}
/* segmented */
.seg{display:flex;background:var(--soft);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;height:34px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(27,26,69,.12)}
/* gateway */
.gw{background:#F7F8FA;min-height:100%}
.gw .url{display:flex;align-items:center;gap:8px;background:#E9EAEE;border-radius:10px;padding:7px 10px;font-size:12px;color:#444;font-family:var(--f-mono)}
.radio{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;width:100%;text-align:left}
.radio.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.radio.on .dot{border:5px solid var(--navy)}
/* member card */
.mcard{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-ink) 100%);position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.mcard::before{content:"";position:absolute;right:-60px;bottom:-80px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(243,112,33,.55),rgba(243,112,33,0) 70%)}
.mcard.gold{background:linear-gradient(135deg,#5B4310 0%,#2D2108 100%)}
/* sheet & toast */
.scrim{position:absolute;inset:0;background:rgba(20,19,46,.45);z-index:40;display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:10px 16px 20px;max-height:86%;overflow:auto;animation:up .22s ease}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
.push{position:absolute;left:10px;right:10px;top:10px;z-index:50;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;padding:11px 13px;box-shadow:0 12px 30px -10px rgba(27,26,69,.35);display:flex;gap:11px;align-items:flex-start;animation:drop .28s ease}
.push .pi{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex:none}
.push .pi img{width:26px}
.push .pt{font-size:11px;color:var(--muted);font-weight:600}
.push .pb{font-weight:700;font-size:13px}
.push .pd{font-size:12.5px;color:var(--ink)}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy-ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:45;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:fade .2s}
/* whatsapp fab */
.fab{position:absolute;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(37,211,102,.7);z-index:20}
.fab svg{width:28px;height:28px;fill:#fff}
/* auth */
.auth{flex:1;min-height:0;overflow:auto;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:28px 22px 24px;position:relative}
.auth .glow{position:absolute;right:-90px;top:120px;width:300px;height:300px;border-radius:50%;border:40px solid rgba(243,112,33,.18)}
.auth .big{font-family:var(--f-display);font-size:34px;line-height:1.05;font-weight:800;margin:0;text-wrap:balance;position:relative}
.auth .tag{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.authf{flex:1;min-height:0;overflow:auto;background:var(--card);padding:20px 16px 24px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{height:54px;text-align:center;font-family:var(--f-mono);font-size:22px;font-weight:700;border-radius:13px;border:1.5px solid var(--line);width:100%;min-width:0}
/* qr */
.qr{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line);display:inline-block}
.qr svg{display:block}
/* admin */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .d{font-size:11.5px;color:var(--good);font-weight:700}
.tl{display:flex;gap:12px}
.tl .tm{width:50px;flex:none;font-family:var(--f-mono);font-weight:700;font-size:12.5px;padding-top:14px;color:var(--navy)}
.tl .bx{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-left:2px solid var(--line);padding-left:12px}
.adminbar{background:var(--navy-ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 16px;display:flex;justify-content:space-between}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle.on{background:var(--good)}
.toggle.on::after{left:21px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--card);font-weight:800}
.stepper b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .ico{margin:0 auto 10px;width:56px;height:56px;border-radius:18px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:8px}
.note svg{color:var(--navy);flex:none;margin-top:1px}
.legal p{line-height:1.6;margin:0 0 12px;color:#33334A}
.legal h4{font-family:var(--f-display);font-size:15px;margin:16px 0 6px}
/* presenter panel */
.panel h2{font-family:var(--f-display);font-size:22px;font-weight:800;margin:0;color:var(--navy-ink);letter-spacing:-.01em}
.panel .pcard{background:#fff;border:1px solid #D9D9E8;border-radius:18px;padding:14px;margin-top:14px}
.fn{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-top:1px solid #EDEDF5;font-size:13px;width:100%;text-align:left;border-radius:8px}
.fn:first-child{border-top:0}
.fn:hover{background:#F6F6FB}
.fn .n{font-family:var(--f-mono);font-weight:700;font-size:11.5px;color:var(--muted)}
.fn .go{font-size:11.5px;font-weight:700;color:var(--orange)}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.ctl button{height:34px;padding:0 12px;border-radius:10px;border:1.5px solid #D9D9E8;background:#fff;font-weight:700;font-size:12.5px;color:var(--navy)}
.ctl button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.flow{margin:0;padding-left:20px;font-size:13px;line-height:1.55}
.flow li{margin-bottom:3px}
.demo-chip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:8px;z-index:30;height:26px;padding:0 10px;border-radius:13px;background:var(--navy-ink);color:#fff;font-size:11px;font-weight:700;align-items:center;gap:5px;opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

    <div class="app" id="app"></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

function nav(){
 const items=S.role==='admin'?[['adash','chart','Today'],['abook','cal','Bookings'],['amanage','grid','Manage'],['aalerts','bell','Alerts'],['aprofile','user','Account']]
  :[['home','home','Home'],['services','wrench','Services'],['bookings','cal','Bookings'],['learn','learn','Learn'],['profile','user','Profile']];
 const on=S.role==='admin'?S.admTab:S.tab;
 return `<nav class="nav">${items.map(([k,i,l])=>`<button class="${on===k&&!S.stack.length?'on':''}" data-tab="${k}">${ic(i)}${l}</button>`).join('')}</nav>`}
const fab=(ctx='')=>`<button class="fab" data-act="wa" data-arg="${esc(ctx)}" aria-label="Chat with SIB on WhatsApp">${WA}</button>`;
const shell=(title,body,{backBtn=false,wa=true,navOn,foot='',nopad=false}={})=>{if(navOn===undefined)navOn=!foot;return `${topBar(title,{backBtn})}<div class="scroll ${nopad?'nopad':''}">${body}</div>${foot?`<div class="footer">${foot}</div>`:''}${wa&&S.role==='customer'?fab(typeof wa==='string'?wa:''):''}${navOn?nav():''}`};
const empty=(i,t,s,btn='')=>`<div class="empty"><div class="ico">${ic(i)}</div><div class="h3" style="color:var(--ink)">${t}</div><div class="small" style="margin:4px 0 14px">${s}</div>${btn}</div>`;
const note=t=>`<div class="note">${ic('info','xs')}<span>${t}</span></div>`;
function qrSvg(seed,size=132){const n=21,c=size/n;let r='';const h=x=>hash(seed+x);
 const fin=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#1B1A33"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#1B1A33"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(h(x+'.'+y)%2)r+=`<rect x="${x*c}" y="${y*c}" width="${c+.3}" height="${c+.3}" fill="#1B1A33"/>`}
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="QR code ${esc(seed)}"><rect width="${size}" height="${size}" fill="#fff"/>${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`}
const svcIco=s=>`<div class="ph" style="background:${CATS[s.cat][2]}">${CATS[s.cat][1]}</div>`;
const priceHtml=s=>isMember()?`<span class="price">${RM(s.m)}</span><span class="strike">${RM(s.p)}</span>`:`<span class="price">${RM(s.p)}</span> <span class="small muted">· Members ${RM(s.m)}</span>`;

 return shell('Cart',items.length?`<div class="stack">
  ${items.some(i=>i.k==='svc')?`<div class="card row"><div class="ico">${ic('car')}</div><div class="grow"><div class="lbl">Services for</div><div style="font-weight:700">${esc(vName(veh(items.find(i=>i.k==='svc').vid)))}</div></div><span class="plate" style="border:1px solid var(--line)">${esc(veh(items.find(i=>i.k==='svc').vid).plate)}</span></div>`:''}
  <div class="list">${items.map((it,ix)=>{if(it.k==='svc'){const s=svc(it.sid);return `<div class="li"><div class="ico">${CATS[s.cat][1]}</div><div class="grow"><div class="t">${esc(s.n)}</div><div class="s">Car service · ${s.dur} min</div></div><div class="price">${RM(priceOf(s))}</div><button class="ibtn" data-act="rmCart" data-arg="${ix}" aria-label="Remove">${ic('trash','sm')}</button></div>`}
   const {t,x}=tSess(it.sess);const left=x.seats-x.taken;return `<div class="li" style="flex-wrap:wrap"><div class="ico or">${ic('learn')}</div><div class="grow"><div class="t">${esc(t.n)}</div><div class="s">${fShort(x.date)} · ${x.mode} · ${left} seats left</div></div><div class="stepper"><button data-act="qty" data-arg="${ix}|-1" aria-label="Fewer">−</button><b>${it.qty}</b><button data-act="qty" data-arg="${ix}|1" aria-label="More">+</button></div><div class="price" style="min-width:76px;text-align:right">${RM((isMember()?x.m:x.p)*it.qty)}</div><button class="ibtn" data-act="rmCart" data-arg="${ix}" aria-label="Remove">${ic('trash','sm')}</button></div>`}).join('')}</div>
  <div class="card"><div class="kv"><span>Subtotal</span><span>${RM(tot.sub)}</span></div>${tot.save?`<div class="kv"><span>Member savings</span><span style="color:var(--good)">−${RM(tot.save)}</span></div>`:''}<div class="kv"><span>Points you'll earn</span><span>${Math.floor(tot.total/100*(isMember()?PLANS.find(p=>p.id===S.sub.plan).mult:1))} pts</span></div><div class="kv total"><span>Total</span><span>${RM(tot.total)}</span></div></div>
  ${items.some(i=>i.k==='svc')?note('Next you’ll pick a date and time. Your slot is held for 10 minutes while you pay.'):''}
  <button class="link" style="align-self:center" data-tab="services">+ Add more services</button></div>`:empty('cart','Your cart is empty','Add a car service or a training session to get started.',`<button class="btn sm" data-tab="services">Browse services</button>`),
 {backBtn:true,wa:false,foot:items.length?`<button class="btn or" data-act="checkout">${items.some(i=>i.k==='svc')?'Choose date & time':'Proceed to payment'} · ${RM(tot.total)}</button>`:''})};
function cartTotal(){let sub=0,total=0;S.cart.forEach(it=>{if(it.k==='svc'){const s=svc(it.sid);sub+=s.p;total+=priceOf(s)}else{const {x}=tSess(it.sess);sub+=x.p*it.qty;total+=(isMember()?x.m:x.p)*it.qty}});return{sub,total,save:sub-total}}

/* booking flow */
V.book=()=>{const d=S.draft;const st=ui.bkStep;const v=veh(d.vid);
 const steps=`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
 const titles=['','Your car & services','Date & time','Your details','Review booking'];
 let body='',foot='';
 if(st===1){body=`<div class="lbl" style="margin-bottom:8px">Step 1 of 4</div><div class="h2">Your car & services</div>
  <div class="list" style="margin-top:12px">${S.vehicles.map(x=>{const m=model(x.model);const ok=d.items.every(id=>svc(id).pt.includes(m.pt));return `<button class="li" data-act="bkVeh" data-arg="${x.id}" ${ok?'':'disabled style="opacity:.45"'}><div class="dot" style="${d.vid===x.id?'border:5px solid var(--navy)':''}"></div><div class="grow"><div class="t">${esc(vName(x))}</div><div class="s">${esc(x.plate)}${ok?'':' · services don’t match this car type'}</div></div>${ptPill(m.pt)}</button>`}).join('')}</div>
  <div class="sec"><span class="h3">Services</span></div><div class="list">${d.items.map(id=>{const s=svc(id);return `<div class="li"><div class="grow"><div class="t">${esc(s.n)}</div><div class="s">${s.dur} min</div></div><div class="price">${RM(priceOf(s))}</div></div>`}).join('')}</div>
  <div class="card" style="margin-top:12px"><div class="kv"><span>Estimated time at centre</span><span>${d.items.reduce((a,id)=>a+svc(id).dur,0)} min</span></div><div class="kv total"><span>Total</span><span>${RM(d.items.reduce((a,id)=>a+priceOf(svc(id)),0))}</span></div></div>`;
  foot=`<button class="btn" data-act="bkStep" data-arg="2">Continue</button>`}
 if(st===2){const days=[];for(let i=0;i<30;i++)days.push(addD(i));const sel=d.date;
  body=`<div class="lbl" style="margin-bottom:8px">Step 2 of 4</div><div class="h2">Pick a date & time</div><p class="small muted" style="margin:0 0 12px">Next 30 days. Greyed days are closed or fully booked.</p>
  <div class="days">${days.map(x=>{const s=iso(x);const open=dayOpen(x)&&HOURS.some(h=>slotInfo(s,h).left>0);return `<button class="day ${sel===s?'on':''} ${open?'':'off'}" data-act="bkDate" data-arg="${s}"><span class="dw">${x.toLocaleDateString('en-MY',{weekday:'short'})}</span><span class="dn">${x.getDate()}</span><span class="dm">${x.toLocaleDateString('en-MY',{month:'short'})}</span></button>`}).join('')}</div>
  ${sel?`<div class="sec"><span class="h3">${fDate(sel)}</span><span class="small muted">${S.cap} cars per slot</span></div>
  <div class="slots">${HOURS.map(h=>{const si=slotInfo(sel,h);const full=si.left===0;return `<button class="slot ${full?'full':''} ${si.left===1?'low':''} ${d.time===h?'on':''}" data-act="bkTime" data-arg="${h}"><b>${fTime(h).replace(':00','')}</b><span>${si.past?'Passed':full?'Full':si.left===1?'1 left':si.left+' left'}</span></button>`}).join('')}</div>
  <div class="row small muted" style="margin-top:10px;gap:14px"><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--good)"></i>Available</span><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--warn)"></i>Almost full</span><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--line)"></i>Full</span></div>`:''}`;
  foot=`<button class="btn" data-act="bkStep" data-arg="3" ${d.date&&d.time?'':'disabled'}>Continue${d.time?` · ${fShort(d.date)}, ${fTime(d.time)}`:''}</button>`}
 if(st===3){body=`<div class="lbl" style="margin-bottom:8px">Step 3 of 4</div><div class="h2">Your details</div><p class="small muted" style="margin:0 0 12px">Pre-filled from your profile. Edit if someone else is sending the car.</p><div class="stack">
  ${fld('bf-n','Full name (as per IC)','bn',d.form.bn)}${fld('bf-p','Phone','bp',d.form.bp,'tel','Malaysian mobile number')}${fld('bf-e','Email','be',d.form.be,'email','Your receipt is sent here')}
  <div class="field"><label for="bf-ic">IC number (MyKad)</label><input class="inp ${ui.err.bic?'err':''}" id="bf-ic" data-f="bic" data-ic="1" inputmode="numeric" maxlength="14" value="${esc(ui.form.bic??d.form.bic)}" placeholder="YYMMDD-PB-####">${ui.err.bic?`<span class="errt">${ui.err.bic}</span>`:'<span class="hint">Used to verify your identity at check-in. Stored encrypted and shown masked.</span>'}</div>
  <div class="field"><label for="bf-nt">Notes for the technician (optional)</label><textarea class="inp" id="bf-nt" data-f="bnote" placeholder="e.g. Warning light appears when charging">${esc(ui.form.bnote??'')}</textarea></div></div>`;
  foot=`<button class="btn" data-act="bkForm">Review booking</button>`}
 if(st===4){const tot=d.items.reduce((a,id)=>a+priceOf(svc(id)),0);const tr=S.cart.filter(i=>i.k==='trn');const trTot=tr.reduce((a,i)=>{const {x}=tSess(i.sess);return a+(isMember()?x.m:x.p)*i.qty},0);
  body=`<div class="lbl" style="margin-bottom:8px">Step 4 of 4</div><div class="h2">Review booking</div><div class="stack" style="margin-top:12px">
  <div class="card"><div class="row"><div class="ico or">${ic('cal')}</div><div class="grow"><div style="font-weight:700">${fDate(d.date)}</div><div class="small muted">${fTime(d.time)} · SIB Service Centre</div></div><button class="link" data-act="bkStep" data-arg="2">Change</button></div></div>
  <div class="card"><div class="kv"><span>Car</span><span>${esc(vName(v))} · ${esc(v.plate)}</span></div><div class="kv"><span>Name</span><span>${esc(d.form.bn)}</span></div><div class="kv"><span>Phone</span><span>${esc(d.form.bp)}</span></div><div class="kv"><span>Email</span><span>${esc(d.form.be)}</span></div><div class="kv"><span>IC</span><span class="mono">${maskIC(d.form.bic)}</span></div></div>
  <div class="card">${d.items.map(id=>`<div class="kv"><span>${esc(svc(id).n)}</span><span>${RM(priceOf(svc(id)))}</span></div>`).join('')}${tr.map(i=>{const {t,x}=tSess(i.sess);return `<div class="kv"><span>${esc(t.n)} × ${i.qty}</span><span>${RM((isMember()?x.m:x.p)*i.qty)}</span></div>`}).join('')}<div class="kv total"><span>Total</span><span>${RM(tot+trTot)}</span></div></div>
  <label class="check"><input type="checkbox" id="bk-t" ${ui.form.bt?'checked':''} data-fc="bt"><span>I agree to the <button class="link" data-go="legal" data-id="refund">Refund & Cancellation Policy</button>. Free reschedule up to 24 hours before the slot.</span></label>${ui.err.bt?`<span class="errt">${ui.err.bt}</span>`:''}
  </div>`;foot=`<button class="btn or" data-act="proceedPay">${ic('lock','sm')} Proceed to payment · ${RM(tot+trTot)}</button>`}
 return `${topBar(titles[st],{backBtn:true,actions:false})}<div class="scroll">${steps}${body}</div><div class="footer">${foot}</div>`};

/* payment */
V.pay=c=>{const o=S.orders.find(x=>x.id===c.order);const b=o.booking?S.bookings.find(x=>x.id===o.booking):null;
 const holdLeft=b?Math.max(0,b.hold-Date.now()):null;const p=ui.pay;
 const banks=['Maybank2u','CIMB Clicks','Public Bank','RHB Now','Bank Islam','Hong Leong Connect'];
 if(ui.paying)return `<div class="top"><span class="sp"></span><h1 style="text-align:center">Processing payment</h1><span class="sp"></span></div><div class="scroll"><div class="empty" style="padding-top:80px"><div class="ico" style="animation:spin 1s linear infinite">${ic('clock')}</div><div class="h3" style="color:var(--ink)">${ui.paying}</div><div class="small" style="margin-top:6px">Don’t close the app.</div></div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
 return `<div class="top" style="flex-direction:column;align-items:stretch;gap:8px"><div class="row"><button class="ibtn" data-act="cancelPay" aria-label="Cancel payment">${ic('x')}</button><h1>Secure payment</h1><span class="pill st-warn">Sandbox</span></div><div class="url">${ic('lock','xs')} pay.gateway-sandbox.my/bill/${o.no.slice(-5)}</div></div>
 <div class="scroll gw"><div class="stack">
  ${b&&b.status==='PENDING_PAYMENT'?`<div class="timer">${ic('lock','sm')} Slot held for you<b id="holdT">${fmtHold(holdLeft)}</b></div>`:''}
  <div class="card"><div class="row"><img src="${LOGO}" alt="SIB" style="height:22px"><span class="grow small muted" style="text-align:right">Order ${o.no}</span></div><div class="kv total" style="border-top:0;margin-top:4px"><span>Amount</span><span>${RM(o.total)}</span></div></div>
  <div class="lbl">Payment method</div>
  ${[['fpx','FPX Online Banking','Pay from your bank account'],['card','Credit / Debit card','Visa, Mastercard'],['ew','E-wallet','Touch ’n Go, GrabPay, Boost']].map(([k,t,s])=>`<button class="radio ${p.m===k?'on':''}" data-act="payM" data-arg="${k}"><span class="dot"></span><div class="grow"><div style="font-weight:700">${t}</div><div class="small muted">${s}</div></div>${ic(k==='fpx'?'home':k==='card'?'card':'coin','sm')}</button>`).join('')}
  ${p.m==='fpx'?`<div class="field"><label for="pg-bank">Bank</label><select class="inp" id="pg-bank" data-pay="bank">${banks.map(x=>`<option ${p.bank===x?'selected':''}>${x}</option>`).join('')}</select></div>`:''}
  ${p.m==='card'?note('Card details are typed on the gateway’s own page. The SIB app and server never see or store the card number.'):''}
  ${p.m==='ew'?`<div class="chips">${['Touch ’n Go eWallet','GrabPay','Boost'].map(x=>`<button class="chip ${p.ew===x?'on':''}" data-act="payEw" data-arg="${x}">${x}</button>`).join('')}</div>`:''}
  ${note('Demo: this page stands in for the payment gateway (e.g. Billplz, ToyyibPay, Fiuu or iPay88 in sandbox). The booking is confirmed only after the gateway’s server callback is verified.')}
 </div></div><div class="footer" style="background:#F7F8FA"><button class="btn" data-act="payNow">Pay ${RM(o.total)}</button><button class="link" style="display:block;margin:10px auto 0" data-act="payFail">Simulate failed payment</button></div>`};
const fmtHold=ms=>{const s=Math.ceil(ms/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};

V.payres=c=>{const o=S.orders.find(x=>x.id===c.order);const ok=o.status==='paid';const b=o.booking?S.bookings.find(x=>x.id===o.booking):null;
 if(!ok){const alive=!b||(b.status==='PENDING_PAYMENT'&&b.hold>Date.now());return `<div class="top"><span class="sp"></span></div><div class="scroll"><div class="empty" style="padding-top:40px"><div class="ico" style="background:var(--bad-soft);color:var(--bad)">${ic('x')}</div><div class="h2" style="color:var(--ink)">Payment not completed</div><div class="small" style="margin:6px 0 16px">${!b?'No money was taken. You can try again.':alive?'Your slot is still held. Try again before the timer runs out.':'The hold ended and your slot was released. Please book again.'}</div>${alive&&b?`<div class="timer" style="max-width:280px;margin:0 auto 16px">${ic('lock','sm')} Slot held<b id="holdT">${fmtHold(b.hold-Date.now())}</b></div>`:''}</div></div>
  <div class="footer"><div class="stack">${alive?`<button class="btn or" data-act="retryPay" data-arg="${o.id}">Try payment again</button>`:`<button class="btn" data-act="startBook">Book again</button>`}<button class="btn ghost" data-act="home">Back to home</button></div></div>`}
 const isB=!!b;const tks=S.tickets.filter(t=>t.order===o.id);
 return `<div class="top"><span class="sp"></span><button class="ibtn" data-act="home" aria-label="Close">${ic('x')}</button></div><div class="scroll"><div class="stack" style="align-items:center;text-align:center">
  <div class="ico" style="width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good)">${ic('check')}</div>
  <div class="h2">${isB?'Booking confirmed':o.kind==='membership'?'Welcome to '+esc(PLANS.find(p=>p.id===S.sub.plan).n):'Payment successful'}</div>
  <div class="muted small">Payment verified by the gateway · ${esc(o.method)} · Ref ${o.ref}</div>
  ${isB?`<div class="card" style="width:100%"><div class="lbl">Booking number</div><div class="mono" style="font-size:20px;font-weight:700;margin:2px 0 12px">${b.no}</div><div class="qr">${qrSvg(b.no)}</div><div class="small muted" style="margin-top:8px">Show this QR at the counter to check in</div>
   <div style="text-align:left;margin-top:12px"><div class="kv"><span>Date</span><span>${fDate(b.date)}</span></div><div class="kv"><span>Time</span><span>${fTime(b.time)} <span class="pill st-good">${ic('lock','xs')} Locked</span></span></div><div class="kv"><span>Car</span><span>${esc(vName(veh(b.veh)))}</span></div></div></div>`:''}
  ${tks.length?`<div class="card" style="width:100%;text-align:left"><div class="lbl" style="margin-bottom:8px">Training tickets</div>${tks.map(t=>`<div class="row" style="margin-bottom:6px">${ic('ticket','sm')}<span class="grow">${esc(tSess(t.sess).t.n)}</span><span class="mono small">${t.code}</span></div>`).join('')}</div>`:''}
  <div class="note" style="width:100%;text-align:left">${ic('coin','xs')}<span>${isB?`You’ll earn <b>${o.ptsPending} points</b> when the service is completed.`:`<b>${o.ptsNow} points</b> added to your balance.`} A receipt was sent to ${esc(S.user.email)}.</span></div>
 </div></div><div class="footer"><div class="btns"><button class="btn ghost" data-go="order" data-id="${o.id}">View receipt</button><button class="btn" data-act="${isB?'viewBk':'home'}" data-arg="${b?b.id:''}">${isB?'View booking':'Done'}</button></div></div>`};

V.bookings=()=>{const seg=ui.seg.bk||'up';const all=mine();
 const lists={up:all.filter(b=>['PENDING_PAYMENT','CONFIRMED','CHECKED_IN','IN_PROGRESS'].includes(b.status)),past:all.filter(b=>b.status==='COMPLETED'||b.status==='NO_SHOW'),cx:all.filter(b=>['CANCELLED','EXPIRED'].includes(b.status))};
 const L=lists[seg].sort((a,b)=>seg==='up'?(a.date+a.time).localeCompare(b.date+b.time):(b.date+b.time).localeCompare(a.date+a.time));
 const tks=S.tickets;
 return shell('My bookings',`<div class="stack"><div class="seg">${[['up','Upcoming'],['past','Past'],['cx','Cancelled']].map(([k,l])=>`<button class="${seg===k?'on':''}" data-act="seg" data-arg="bk|${k}">${l}</button>`).join('')}</div>
 ${L.length?L.map(b=>`<button class="card" style="text-align:left;width:100%" data-go="bkd" data-id="${b.id}"><div class="row"><div class="grow"><div class="lbl">${fDate(b.date)} · ${fTime(b.time)}</div><div class="h3" style="margin-top:4px">${esc(svc(b.items[0]).n)}${b.items.length>1?` +${b.items.length-1} more`:''}</div><div class="small muted" style="margin-top:2px">${esc(vName(veh(b.veh)))} · ${b.no}</div></div>${stPill(b.status)}</div>${b.status==='COMPLETED'&&!b.rated?`<div class="row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span class="grow small" style="font-weight:600">How was your service?</span><span class="link">Rate now →</span></div>`:''}</button>`).join(''):empty('cal','No bookings here','Book a service for your car in a few taps.',`<button class="btn sm" data-act="startBook">Book a service</button>`)}
 ${seg==='up'&&tks.length?`<div class="sec"><span class="h3">Training tickets</span></div>${tks.map(t=>{const {t:tr,x}=tSess(t.sess);return `<div class="card row"><div class="ico or">${ic('ticket')}</div><div class="grow"><div style="font-weight:700">${esc(tr.n)}</div><div class="small muted">${fDate(x.date)} · ${x.t} · ${x.mode}</div></div><button class="ibtn" data-act="showTicket" data-arg="${t.id}" aria-label="Show ticket QR">${ic('qr')}</button></div>`}).join('')}`:''}
 </div>`)};

V.bkd=c=>{const b=S.bookings.find(x=>x.id===c.id);const v=veh(b.veh);const o=S.orders.find(x=>x.id===b.order);
 const canChange=['CONFIRMED'].includes(b.status)&&(new Date(b.date+'T'+b.time)-Date.now())>24*3600e3;
 const flow=['CONFIRMED','CHECKED_IN','IN_PROGRESS','COMPLETED'];const idx=flow.indexOf(b.status);
 return shell('Booking',`<div class="stack">
  <div class="card" style="text-align:center"><div class="row"><span class="mono grow" style="text-align:left;font-weight:700">${b.no}</span>${stPill(b.status)}</div>
   ${['CONFIRMED','CHECKED_IN'].includes(b.status)?`<div style="margin:14px 0 4px"><div class="qr">${qrSvg(b.no,150)}</div><div class="small muted" style="margin-top:6px">Show at the counter to check in</div></div>`:''}</div>
  ${idx>=0?`<div class="card"><div class="lbl" style="margin-bottom:10px">Progress</div>${flow.map((s,i)=>`<div class="row" style="margin-bottom:${i<3?10:0}px"><span style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:${i<=idx?'var(--good)':'var(--soft)'};color:${i<=idx?'#fff':'var(--muted)'}">${i<=idx?ic('check','xs'):''}</span><span class="grow" style="font-weight:${i===idx?700:500};color:${i<=idx?'var(--ink)':'var(--muted)'}">${STL[s][0]}</span></div>`).join('')}</div>`:''}
  <div class="card"><div class="kv"><span>Date</span><span>${fDate(b.date)}</span></div><div class="kv"><span>Time</span><span>${fTime(b.time)}</span></div><div class="kv"><span>Car</span><span>${esc(vName(v))} · ${esc(v.plate)}</span></div><div class="kv"><span>Location</span><span>SIB Service Centre</span></div></div>
  <div class="card">${b.items.map(id=>`<div class="kv"><span>${esc(svc(id).n)}</span><span>${o?'':RM(priceOf(svc(id)))}</span></div>`).join('')}${o?`<div class="kv total"><span>Paid</span><span>${RM(o.total)}</span></div>`:''}</div>
  ${b.status==='COMPLETED'&&!b.rated?`<button class="btn or" data-go="rate" data-id="${b.id}">${ic('star','sm')} Rate this service</button>`:''}
  ${b.status==='COMPLETED'&&b.rated?`<div class="card row"><span class="grow small muted">Your rating</span>${starRow(b.rated)}</div>`:''}
  ${b.status==='COMPLETED'?`<button class="btn ghost" data-act="bookAgain" data-arg="${b.id}">Book again</button>`:''}
  ${b.status==='CONFIRMED'?`<div class="btns"><button class="btn ghost" data-act="${canChange?'resched':'tooLate'}" data-arg="${b.id}">Reschedule</button><button class="btn danger" data-act="${canChange?'cancelBk':'tooLate'}" data-arg="${b.id}">Cancel</button></div>${canChange?'':note('Changes are allowed up to 24 hours before your slot. Chat with us on WhatsApp for help.')}`:''}
 </div>`,{backBtn:true,wa:'booking '+b.no})};

V.rate=c=>{const b=S.bookings.find(x=>x.id===c.id);const r=ui.rate;
 return shell('Rate service',`<div class="stack" style="text-align:center"><div class="muted small">${b.no} · ${fDate(b.date)}</div><div class="h2">${esc(b.items.map(i=>svc(i).n).join(' + '))}</div>
  <div class="row" style="justify-content:center;gap:6px;margin:8px 0">${[1,2,3,4,5].map(i=>`<button data-act="setRate" data-arg="${i}" aria-label="${i} star${i>1?'s':''}"><svg viewBox="0 0 24 24" width="42" height="42" style="fill:${i<=r?'#F2A31B':'var(--line)'}">${P.star}</svg></button>`).join('')}</div>

function startBook(items,vid){
 const v=vid||(S.cart.find(i=>i.k==='svc')?.vid)||S.defVeh;
 const its=items||S.cart.filter(i=>i.k==='svc').map(i=>i.sid);
 if(!its.length){S.pt=model(veh(v).model).pt;tab('services');toast('Pick a service for your '+vName(veh(v)));return}
 S.draft={vid:v,items:its,date:null,time:null,form:{bn:S.user.name,bp:S.user.phone,be:S.user.email,bic:S.user.ic}};
 ui.bkStep=1;ui.err={};ui.form={};go('book')}
function addSvcToCart(sid,then){const s=svc(sid);const vid=S.defVeh;const m=model(veh(vid).model);
 if(!s.pt.includes(m.pt)){const alt=S.vehicles.find(v=>s.pt.includes(model(v.model).pt));if(!alt){toast('This service is not available for your cars');return false}
  return addWithVeh(sid,alt.id,then)}
 return addWithVeh(sid,vid,then)}
function addWithVeh(sid,vid,then){const cv=S.cart.find(i=>i.k==='svc');
 if(cv&&cv.vid!==vid){ui.sheet=()=>`<div class="h3">Replace cart?</div><p class="muted small">Your cart has services for <b>${esc(vName(veh(cv.vid)))}</b>. One booking covers one car.</p><div class="btns"><button class="btn ghost" data-act="closeSheet">Keep cart</button><button class="btn" data-act="replaceCart" data-arg="${sid}|${vid}|${then||''}">Replace with ${esc(vName(veh(vid)))}</button></div>`;drawOverlay();return false}
 if(S.cart.some(i=>i.k==='svc'&&i.sid===sid)){if(!then)toast('Already in your cart');return true}
 S.cart.push({k:'svc',sid,vid});if(!then)toast('Added to cart · '+svc(sid).n);return true}
function createOrderAndPay({kind,items,total,booking,ptsNow=0,ptsPending=0,trn=[],plan}){
 const o={id:'o'+Date.now(),no:'SIB-ORD-'+(25200+S.orders.length),kind,items,total,status:'pending',date:TODAY,booking,ptsNow,ptsPending,trn,plan};
 S.orders.unshift(o);ui.pay={m:'fpx',bank:'Maybank2u'};go('pay',{order:o.id});startTimer();return o}
function mult(){return isMember()?PLANS.find(p=>p.id===S.sub.plan).mult:1}
function startTimer(){clearInterval(S.timer);S.timer=setInterval(()=>{const el=document.getElementById('holdT');const c=cur();
 const pend=S.bookings.filter(b=>b.status==='PENDING_PAYMENT');
 pend.forEach(b=>{if(b.hold<=Date.now())expireHold(b)});
 if(el){const o=S.orders.find(x=>x.id===c.order);const b=o&&o.booking&&S.bookings.find(x=>x.id===o.booking);if(b&&b.status==='PENDING_PAYMENT')el.textContent=fmtHold(b.hold-Date.now())}
 if(!pend.length)clearInterval(S.timer)},500)}
function expireHold(b){b.status='EXPIRED';const o=S.orders.find(x=>x.booking===b.id);if(o&&o.status==='pending')o.status='cancelled';
 if(o)o.trn.forEach(t=>{const {x}=tSess(t.sess);x.taken-=t.qty});
 toast('Payment time ran out. The slot was released.');const c=cur();if(c.s==='pay'||c.s==='payres'){S.stack=S.stack.filter(x=>x.s!=='pay'&&x.s!=='payres'&&x.s!=='book');go('payres',{order:o.id})}}
function completePay(o,method){o.status='paid';o.method=method;o.ref=(method.startsWith('FPX')?'FPX':method.startsWith('Card')?'CRD':'EWL')+Date.now().toString().slice(-8);
 if(o.booking){const b=S.bookings.find(x=>x.id===o.booking);b.status='CONFIRMED';b.hold=null;b.order=o.id;
  S.cart=S.cart.filter(i=>i.k!=='svc');
  push('customer','Booking confirmed',`${b.no} · ${fShort(b.date)} at ${fTime(b.time)}. Your slot is locked.`,['bkd',{id:b.id}]);
  S.notifs.a.unshift({id:'na'+Date.now(),t:'New booking',b:`${S.user.name} · ${vName(veh(b.veh))} · ${fShort(b.date)} ${b.time}`,d:nowStamp(),read:false})}
 o.trn.forEach(t=>{for(let i=0;i<t.qty;i++)S.tickets.push({id:'tk'+Date.now()+i+rnd(2),sess:t.sess,order:o.id,code:'TK-'+rnd(6)})});
 if(o.trn.length)S.cart=S.cart.filter(i=>i.k!=='trn');
 if(o.kind==='membership'){const pl=PLANS.find(p=>p.id===o.plan);if(S.sub&&S.sub.status==='active'){const e=dOf(S.sub.end);pl.per==='year'?e.setFullYear(e.getFullYear()+1):e.setMonth(e.getMonth()+1);S.sub.end=iso(e)}else{const e=new Date(T0);pl.per==='year'?e.setFullYear(e.getFullYear()+1):e.setMonth(e.getMonth()+1);S.sub={plan:pl.id,start:TODAY,end:iso(e),status:'active',no:'SIB '+String(4400+Math.floor(Math.random()*500))+' '+String(Math.floor(1000+Math.random()*8999))}}
  push('customer','Membership active',`${pl.n} is active until ${fShort(S.sub.end)}. Member prices are on.`,['membership'])}
 if(o.ptsNow){S.ledger.push({d:TODAY,t:o.kind==='membership'?'Membership · '+o.items[0].n:'Training purchase · '+o.no,v:o.ptsNow})}
}

];
function cust(t,st=[]){S.role='customer';S.tab=t;S.stack=st.map(([s,p])=>({s,...(p||{})}));ui.sheet=null}
function adm(t,st=[]){S.role='admin';S.admTab=t;S.stack=st.map(([s,p])=>({s,...(p||{})}));ui.sheet=null}
function renderPanel(){const p=document.getElementById('panel');const pend=S.bookings.find(b=>b.status==='PENDING_PAYMENT');
 p.innerHTML=`<div class="row" style="align-items:flex-start"><div class="grow"><div class="lbl">Proof of concept · for SIB review</div><h2 style="margin-top:4px">SIB Service App</h2><p class="small" style="margin:6px 0 0;color:#5A5878;line-height:1.5">EV, PHEV & Hybrid service booking. Tap any function to jump to it, or follow the demo flow. All data is sample data.</p></div><button class="ibtn demo-close" data-act="closePanel" aria-label="Close guide" style="display:none">${ic('x')}</button></div>
 <div class="pcard"><div class="lbl" style="margin-bottom:8px">View as</div><div class="ctl"><button class="${S.role==='customer'?'on':''}" data-p="customer">Customer</button><button class="${S.role==='admin'?'on':''}" data-p="admin">HQ Admin</button><button class="${!S.role?'on':''}" data-p="logout">Login screen</button></div></div>
 <div class="pcard"><div class="lbl" style="margin-bottom:8px">Suggested demo flow · about 6 minutes</div><ol class="flow"><li>Register with a referral code, verify OTP</li><li>Services → pick a car type → brand → model</li><li>Book now → date & time → form with IC → review</li><li>Pay in sandbox, watch the slot hold timer → booking locked</li><li>Switch to HQ Admin → see the new booking alert</li><li>Check in → start → complete the booking</li><li>Back to Customer → points credited → rate the service</li><li>Membership, training purchase, events, referral, WhatsApp, Terms</li></ol></div>
 <div class="pcard"><div class="lbl" style="margin-bottom:6px">The 21 functions requested</div>${FN.map((f,i)=>`<button class="fn" data-fn="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${f[0]}</span><span class="go">Show →</span></button>`).join('')}</div>
 <div class="pcard"><div class="lbl" style="margin-bottom:8px">Presenter controls</div><div class="ctl">
  <button class="${S.race?'on':''}" data-p="race">${S.race?'Slot race armed':'Simulate slot race'}</button>
  <button data-p="expire" ${pend?'':'disabled style="opacity:.45"'}>Expire payment hold now</button>
  <button data-p="memb">${isMember()?'Expire membership':'Make demo user a member'}</button>
  <button data-p="reset">Reset demo</button></div>
  <p class="small" style="color:#5A5878;margin:10px 0 0;line-height:1.5"><b>Slot race:</b> the next “Proceed to payment” acts as if another customer took the same slot a moment earlier. <b>Expire hold:</b> shows the slot being released when payment isn’t finished in ${S.holdMin} minutes.</p></div>
 <p class="small" style="color:#5A5878;margin:14px 4px">Prepared by OS Startup Sdn Bhd · Prices, plans, brands and policies are placeholders pending SIB confirmation.</p>`;
 const cl=p.querySelector('.demo-close');if(cl&&window.matchMedia&&matchMedia('(max-width:860px)').matches)cl.style.display='grid'}
document.getElementById('panel').addEventListener('click',e=>{const t=e.target.closest('[data-fn],[data-p],[data-act]');if(!t)return;const p=document.getElementById('panel');
 if(t.dataset.act==='closePanel'){p.classList.remove('open');return}
 if(t.dataset.fn!=null){FN[+t.dataset.fn][1]();p.classList.remove('open');render(true);return}
 const k=t.dataset.p;
 if(k==='customer')cust(S.tab||'home');if(k==='admin')adm(S.admTab||'adash');if(k==='logout'){S.role=null;S.auth='welcome';S.stack=[]}
 if(k==='race'){S.race=!S.race;toast(S.race?'Next payment attempt will lose the slot race':'Slot race off')}
 if(k==='expire'){S.bookings.filter(b=>b.status==='PENDING_PAYMENT').forEach(b=>{b.hold=Date.now()-1});startTimer();renderPanel();return}
 if(k==='memb'){if(isMember()){S.sub.status='expired';S.sub.end=iso(addD(-1));toast('Membership expired · member prices removed')}else{S.sub={plan:'gold',start:TODAY,end:iso(addD(365)),status:'active',no:'SIB 4471 2093'};toast('Demo user is now a Gold member')}}
 if(k==='reset'){clearInterval(S.timer);S=fresh();Object.assign(ui,{sheet:null,form:{},err:{},seg:{},bkStep:1});toast('Demo reset')}
 p.classList.remove('open');render(true)});

/* ---------- events ---------- */
app.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-go],[data-tab]');if(!t)return;
 if(t.classList.contains('scrim')&&e.target.closest('.sheet'))return;
 if(t.tagName==='A')return;
 if(t.dataset.tab){tab(t.dataset.tab);return}
 if(t.dataset.go){const p={};if(t.dataset.id)p.id=t.dataset.id;if(t.dataset.go==='training'||t.dataset.go==='rate'){ui.form.tsess=null;ui.form.tqty=1}go(t.dataset.go,p);return}
 const a=t.dataset.act;if(A[a]){e.preventDefault();A[a](t.dataset.arg)}});
app.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.ic){let d=t.value.replace(/\D/g,'').slice(0,12);let v=d.slice(0,6);if(d.length>6)v+='-'+d.slice(6,8);if(d.length>8)v+='-'+d.slice(8);t.value=v}
 if(t.dataset.f)ui.form[t.dataset.f]=t.value;
 if(t.dataset.pay)ui.pay[t.dataset.pay]=t.value});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.fc)ui.form[t.dataset.fc]=t.checked;if(t.dataset.f){ui.form[t.dataset.f]=t.value;if(t.dataset.rerender){ui.form.cm=null;render()}}if(t.dataset.pay)ui.pay[t.dataset.pay]=t.value});
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-MY',{hour:'numeric',minute:'2-digit',hour12:false})}
tick();setInterval(tick,20000);
render(true);
</script>

</body>
</html>
